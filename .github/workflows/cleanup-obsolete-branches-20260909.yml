name: One-time obsolete branch cleanup

on:
  push:
    branches:
      - fix/full-repository-review-20260908
    paths:
      - .github/workflows/cleanup-obsolete-branches-20260909.yml

permissions:
  contents: write

concurrency:
  group: obsolete-branch-cleanup-20260909
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'shudnal/ConditionalConfigSync' && github.ref == 'refs/heads/fix/full-repository-review-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only the reviewed obsolete branch refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = 'shudnal/ConditionalConfigSync'
          working_branch = 'fix/full-repository-review-20260908'
          master_sha = 'd0dcaa36fd6bc19e424cf2b092a7b926102f0fef'
          common_sha = 'b764076029566652c4bea6f1966e36317d0c0b43'
          expected = dict.fromkeys([
              'feat/1.0.5-sync-lifecycle',
              'feat/1.0.5-sync-lifecycle-codex',
              'feat/1.0.5-sync-lifecycle-final',
              'feat/1.0.5-sync-lifecycle-final-pr',
              'feat/1.0.5-sync-lifecycle-final-review',
              'feat/1.0.5-sync-lifecycle-master-pr',
              'feat/1.0.5-sync-lifecycle-open-pr',
              'feat/1.0.5-sync-lifecycle-pr',
              'feat/1.0.5-sync-lifecycle-pr3',
              'feat/1.0.5-sync-lifecycle-pr-head',
              'feat/1.0.5-sync-lifecycle-release',
              'feat/1.0.5-sync-lifecycle-release-pr',
              'feat/1.0.5-sync-lifecycle-release-review',
              'feat/1.0.5-sync-lifecycle-review',
              'feat/1.0.5-sync-lifecycle-review-pr',
              'feat/1.0.5-sync-lifecycle-temp-check',
              'feat/1.0.5-sync-lifecycle-to-master',
              'fix/1.0.5-snapshot-cache-review',
          ], common_sha)
          expected['feat/1.0.5-sync-lifecycle-review-base'] = '40c375cfe42c93c23986e7f5e1f9a455dd90c0ab'
          expected['review/1.0.5-sync-lifecycle'] = '6321ad205764c4a7504f7a42b7575552a1b7635b'
          keep = {'master', working_branch}

          if os.environ.get('GITHUB_REPOSITORY') != repository:
              raise RuntimeError('Unexpected repository; refusing cleanup.')
          if os.environ.get('GITHUB_REF') != 'refs/heads/' + working_branch:
              raise RuntimeError('Unexpected workflow branch; refusing cleanup.')
          if set(expected) & keep or len(expected) != 20:
              raise RuntimeError('Invalid cleanup allowlist.')

          def api(method, path, allow_missing=False):
              request = Request(
                  'https://api.github.com/repos/' + repository + path,
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'ConditionalConfigSync-branch-cleanup',
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      payload = response.read()
                      if method == 'DELETE' and response.status != 204:
                          raise RuntimeError('Unexpected delete response.')
                      return json.loads(payload) if payload else None
              except HTTPError as error:
                  if allow_missing and error.code == 404:
                      return None
                  raise RuntimeError(f'{method} {path} failed with HTTP {error.code}.') from None

          def branch_sha(name):
              data = api('GET', '/git/ref/heads/' + quote(name, safe='/'), allow_missing=True)
              return data['object']['sha'] if data else None

          def check_retained_branches():
              if api('GET', '')['default_branch'] != 'master':
                  raise RuntimeError('Default branch changed; refusing cleanup.')
              if branch_sha('master') != master_sha:
                  raise RuntimeError('Master changed; refusing cleanup.')
              if branch_sha(working_branch) != os.environ['GITHUB_SHA']:
                  raise RuntimeError('Working branch changed; refusing cleanup.')

          check_retained_branches()
          # Validate every target before the first deletion. New work is never silently discarded.
          for branch, sha in expected.items():
              current = branch_sha(branch)
              if current is not None and current != sha:
                  raise RuntimeError(f'Branch changed since inspection: {branch}.')
              print(f'Approved target: {branch} at {sha}', flush=True)

          deleted = []
          for branch, sha in expected.items():
              check_retained_branches()
              current = branch_sha(branch)
              if current is None:
                  print(f'Already absent: {branch}', flush=True)
                  continue
              if current != sha:
                  raise RuntimeError(f'Branch changed during cleanup: {branch}.')
              api('DELETE', '/git/refs/heads/' + quote(branch, safe='/'))
              deleted.append(branch)
              print(f'Deleted: {branch}', flush=True)

          check_retained_branches()
          remaining = []
          page = 1
          while True:
              batch = api('GET', f'/branches?per_page=100&page={page}')
              remaining.extend(branch['name'] for branch in batch)
              if len(batch) < 100:
                  break
              page += 1
          if set(remaining) != keep:
              raise RuntimeError(f'Unexpected remaining branches: {remaining}.')
          print(f'Cleanup complete: {len(deleted)} deleted; remaining: {sorted(remaining)}', flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('# Owner-approved branch cleanup\n\n')
              summary.write(f'Deleted {len(deleted)} obsolete branch refs. Retained master and {working_branch}.\n\n')
              summary.write('No mod build, execution, tests, tags, or release changes were performed.\n\n')
              summary.write('| Deleted branch | Previous commit |\n| --- | --- |\n')
              for branch in deleted:
                  summary.write(f'| `{branch}` | `{expected[branch]}` |\n')
          PY
