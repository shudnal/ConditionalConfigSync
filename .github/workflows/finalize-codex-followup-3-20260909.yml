name: Finalize third Codex follow-up

on:
  push:
    branches:
      - fix/full-repository-review-20260908
    paths:
      - .github/workflows/finalize-codex-followup-3-20260909.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'shudnal/ConditionalConfigSync' && github.ref == 'refs/heads/fix/full-repository-review-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Complete declared/runtime serialization symmetry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('ConditionalConfigSync/Parts/CustomValueSerialization.cs')
          text = source.read_text(encoding='utf-8')
          old = '        int startPosition = GameReflection.PackageGetPos(package);\n        GameReflection.Serialize(new[] { value }, ref package);\n'
          new = '        RequireExactRuntimeType(effectiveType, value, "custom value");\n        int startPosition = GameReflection.PackageGetPos(package);\n        GameReflection.Serialize(new[] { value }, ref package);\n'
          if text.count(old) != 1:
              raise RuntimeError('Unexpected legacy ZRpc fallback source shape.')
          source.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          report = Path('docs/reviews/2026-09-09-codex-follow-up-3.md')
          text = report.read_text(encoding='utf-8')
          old = "The same exact-runtime-type rule is applied to root ISerializableParameter values because Valheim's writer dispatches on the runtime object while the reader constructs the declared type.\n"
          new = old + "The legacy ZRpc fallback for other reference types is checked the same way: a declared base/interface/object value cannot hide a different runtime encoding that the declared-type reader would not consume symmetrically.\n"
          if text.count(old) != 1:
              raise RuntimeError('Unexpected follow-up report source shape.')
          report.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
          if git diff --name-only | grep -E '(^|/)CHANGELOG\.md$'; then
            echo 'Unexpected changelog modification.' >&2
            exit 1
          fi

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Suden"
          git config user.email "20457922+shudnal@users.noreply.github.com"
          git rm .github/workflows/finalize-codex-followup-3-20260909.yml
          git add ConditionalConfigSync/Parts/CustomValueSerialization.cs \
                  docs/reviews/2026-09-09-codex-follow-up-3.md
          git diff --cached --check
          git commit -m "Reject asymmetric root polymorphic custom values"
          git push origin HEAD:fix/full-repository-review-20260908
